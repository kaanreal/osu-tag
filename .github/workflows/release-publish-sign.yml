name: Build, Sign and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (e.g., v1.2.3). If omitted, using tag when triggered by push.'
        required: false

env:
  BUILD_RUNTIME: win-x64
  BUILD_CONFIGURATION: Release

jobs:
  build-and-package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: set_version
        shell: powershell
        run: |
          if ("${{ github.ref_name }}" -ne "") {
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          } else {
            echo "version=unspecified" >> $GITHUB_OUTPUT
          }

      - name: Get app version from source
        id: get_app_version
        shell: powershell
        run: |
          $file = 'Services\UpdateService.cs'
          $app = ''
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            if ($content -match 'Current\s*=\s*"(?<v>[^\"]+)"') { $app = $matches['v'] }
          }
          echo "app_version=$app" >> $GITHUB_OUTPUT

      - name: Verify tag matches app version
        if: ${{ steps.set_version.outputs.version != 'unspecified' }}
        shell: powershell
        run: |
          $tag = '${{ steps.set_version.outputs.version }}'.TrimStart('v')
          $app = '${{ steps.get_app_version.outputs.app_version }}'
          if ([string]::IsNullOrWhiteSpace($app)) {
            Write-Host "No app version found in source; skipping match check"
            exit 0
          }
          if ($tag -ne $app) {
            Write-Error "Tag ($tag) does not match app version ($app). Update Services/UpdateService.cs or use a matching tag."
            exit 1
          }
          Write-Host "Tag matches app version: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OsuTag.csproj

      - name: Publish
        run: |
          dotnet publish OsuTag.csproj -c ${{ env.BUILD_CONFIGURATION }} -r ${{ env.BUILD_RUNTIME }} --self-contained false -o .\build\dist\publish

      - name: Create publish zip
        run: |
          $ver = '${{ steps.set_version.outputs.version }}'
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $short = (git rev-parse --short HEAD)
            $ver = "git-$short"
          }
          $zipPath = "./build/dist/OsuTag-$ver.zip"
          Write-Host "Creating publish zip: $zipPath"
          Compress-Archive -Path './build/dist/publish/*' -DestinationPath $zipPath -Force
        shell: powershell

      - name: Install Inno Setup (optional)
        run: choco install innosetup -y
        shell: powershell

      - name: Build installer with Inno Setup
        run: |
          $ver = '${{ steps.set_version.outputs.version }}'
          $source = "${{ github.workspace }}\\build\\dist\\publish"
          $iss = "${{ github.workspace }}\\build\\innosetup\\OsuTagInstaller.iss"
          $args = @()
          if (-not [string]::IsNullOrWhiteSpace($ver) -and $ver -ne 'unspecified') { $args += "/DMyAppVersion=$ver" }
          $args += ("/DSourcePath=`"$source`"")
          Write-Host "Running Inno Setup: C:\Program Files (x86)\Inno Setup 6\ISCC.exe $($args -join ' ') $iss"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $args $iss
        shell: powershell

      - name: Create installer output folder and copy installer
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          if (!(Test-Path 'build\dist\installer')) { New-Item -ItemType Directory -Path 'build\dist\installer' | Out-Null }
          $src = Get-ChildItem -Path 'build\innosetup\Output' -Filter 'OsuTag-Setup-*.exe' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -ne $src) {
              if (-not [string]::IsNullOrWhiteSpace($env:VERSION) -and $env:VERSION -ne 'unspecified') {
                  $dest = Join-Path 'build\dist\installer' ("OsuTag-Setup-$($env:VERSION).exe")
              } else {
                  $dest = Join-Path 'build\dist\installer' $src.Name
              }
              Copy-Item $src.FullName -Destination $dest -Force
              Write-Host "Installer placed at: $dest (source: $($src.FullName))"
          } else {
              Write-Warning "No installer found in Inno output folder"
          }
        shell: powershell

  sign-and-publish:
    needs: build-and-package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION
        run: echo "VERSION=${{ needs.build-and-package.outputs.version }}" >> $GITHUB_ENV

      - name: Prepare artifacts list
        run: |
          echo "PUBLISH_ZIP=build/dist/OsuTag-${{ needs.build-and-package.outputs.version }}.zip" >> $GITHUB_ENV
          echo "INSTALLER=build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe" >> $GITHUB_ENV
          powershell -Command "if (Test-Path 'build/dist/OsuTag-${{ needs.build-and-package.outputs.version }}.zip') { echo 'PUBLISH_ZIP_EXISTS=true' >> $env:GITHUB_ENV } else { echo 'PUBLISH_ZIP_EXISTS=false' >> $env:GITHUB_ENV }"
          powershell -Command "if (Test-Path 'build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe') { echo 'INSTALLER_EXISTS=true' >> $env:GITHUB_ENV } else { echo 'INSTALLER_EXISTS=false' >> $env:GITHUB_ENV }"
          powershell -Command "if (Test-Path 'build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.sha256.txt') { echo 'SHA_EXISTS=true' >> $env:GITHUB_ENV } else { echo 'SHA_EXISTS=false' >> $env:GITHUB_ENV }"

      - name: "Optional: decode signing cert"
        env:
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT }}
          SIGN_CERT_PW: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGN_CERT_B64)) {
            [IO.File]::WriteAllBytes('cert.pfx',[Convert]::FromBase64String($env:SIGN_CERT_B64))
            Write-Host 'Decoded cert.pfx'
          } else {
            Write-Host 'No SIGN_CERT provided; skipping decode'
          }
        shell: powershell

      - name: "Optional: Sign installer and exe"
        env:
          SIGN_PW: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          # Sign installer if cert.pfx exists and password is provided
          $installer = "build\\dist\\installer\\OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe"
          $exe = "build\\dist\\publish\\OsuTag.exe"
          if ((Test-Path 'cert.pfx') -and (-not [string]::IsNullOrWhiteSpace($env:SIGN_PW))) {
              Write-Host "Signing $installer"
              & signtool sign /f cert.pfx /p $env:SIGN_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
              if (Test-Path $exe) {
                  Write-Host "Signing $exe"
                  & signtool sign /f cert.pfx /p $env:SIGN_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
              }
          } else {
              Write-Host "cert.pfx or SIGN_PW missing; skipping signing"
          }
        shell: powershell

      - name: Prepare release body
        id: prepare_release_body
        shell: powershell
        run: |
          $template = 'RELEASE_TEMPLATE.md'
          if (Test-Path $template) {
            echo "body<<EOF" >> $GITHUB_OUTPUT
            Get-Content $template -Raw >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          } else {
            $v = '${{ needs.build-and-package.outputs.version }}'
            if ($v -eq 'unspecified' -or [string]::IsNullOrWhiteSpace($v)) { $v = 'unspecified' }
            echo "body=Release $v" >> $GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        id: create_release
        if: ${{ needs.build-and-package.outputs.version != '' && needs.build-and-package.outputs.version != 'unspecified' }}
        uses: actions/create-release@v1
        with:
          tag_name: ${{ needs.build-and-package.outputs.version }}
          release_name: ${{ needs.build-and-package.outputs.version }}
          body: ${{ steps.prepare_release_body.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create SHA256 of installer
        if: ${{ env.INSTALLER_EXISTS == 'true' }}
        run: |
          $installer = "build\\dist\\installer\\OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe"
          $sha = Get-FileHash -Algorithm SHA256 $installer | Select -ExpandProperty Hash
          $sha | Out-File -FilePath build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.sha256.txt -Encoding ASCII
        shell: powershell

      - name: Upload publish ZIP
        if: ${{ needs.build-and-package.outputs.version != '' && needs.build-and-package.outputs.version != 'unspecified' && env.PUBLISH_ZIP_EXISTS == 'true' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/dist/OsuTag-${{ needs.build-and-package.outputs.version }}.zip
          asset_name: OsuTag-${{ needs.build-and-package.outputs.version }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer (if exists)
        if: ${{ needs.build-and-package.outputs.version != '' && needs.build-and-package.outputs.version != 'unspecified' && env.INSTALLER_EXISTS == 'true' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe
          asset_name: OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer SHA256
        if: ${{ needs.build-and-package.outputs.version != '' && needs.build-and-package.outputs.version != 'unspecified' && env.SHA_EXISTS == 'true' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/dist/installer/OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.sha256.txt
          asset_name: OsuTag-Setup-${{ needs.build-and-package.outputs.version }}.sha256.txt
          asset_content_type: text/plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup certificate
        run: |
          if (Test-Path cert.pfx) { del cert.pfx; Write-Host 'Deleted cert.pfx' } else { Write-Host 'cert.pfx not found; nothing to clean' }
        shell: powershell