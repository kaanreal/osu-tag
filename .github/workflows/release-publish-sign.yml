name: Release, Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required for creating releases and uploading artifacts
  packages: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          # normalize: strip leading 'v' or 'V'
          VERSION=${TAG_REF#v}
          echo "TAG_REF=$TAG_REF" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::set-output name=version::$VERSION"

      - name: Display version
        run: echo "Releasing version: ${{ env.VERSION }}"

      - name: Restore
        run: dotnet restore

      - name: Build with version
        run: |
          dotnet build -c Release -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }} -p:FileVersion=${{ env.VERSION }} -p:AssemblyInformationalVersion=${{ env.VERSION }}

      - name: Run unit tests
        run: dotnet test -c Release --no-build

      - name: Publish self-contained single-file publish (x64)
        run: |
          dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.VERSION }} -o ./publish/win-x64

      - name: Create installer (Inno Setup)
        env:
          Version: ${{ env.VERSION }}
        run: |
          powershell -ExecutionPolicy Bypass -File build\create-installer.ps1 -Version $env:Version

      - name: Prepare release notes
        id: release_notes
        run: |
          # Use a simple templated release body. You can expand this to use a file or generate notes from commits.
          echo "Release ${VERSION}" > release_notes.txt
          echo "\nChangelog: (add changelog here)" >> release_notes.txt
          echo "::set-output name=body::$(cat release_notes.txt)"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_REF }}
          name: ${{ env.TAG_REF }}
          body_path: release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_REF }}
          files: |
            build/dist/installer/**
            build/**.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: (Optional) Sign artifacts with signtool
        if: secrets.SIGN_CERT_PFX != '' && secrets.SIGN_CERT_PFX != null
        env:
          PFX_BASE64: ${{ secrets.SIGN_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.SIGN_CERT_PFX_PASSWORD }}
        run: |
          echo "$PFX_BASE64" | PowerShell -Command "[System.Convert]::FromBase64String((Get-Content -Raw -Encoding ASCII -)) -as [byte[]] | Set-Content -Path cert.pfx -Encoding Byte"
          # Sign the main exe - adjust path as needed
          signtool sign /fd SHA256 /a /f cert.pfx /p "$PFX_PASSWORD" publish\win-x64\OsuTag.exe

      - name: Cleanup temporary files
        if: ${{ always() }}
        run: git clean -fdx

      - name: Final message
        run: echo "Release ${{ env.VERSION }} finished"
