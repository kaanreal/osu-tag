name: Build & Publish

on:
    release:
        types: [published]

jobs:
    build:
        name: 🏗️ Build
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.target_commitish }}

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns"
                  cat > "osu!tag.app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <plist version="1.0">
                  <dict>
                    <key>CFBundleExecutable</key><string>OsuTag</string>
                    <key>CFBundleIconFile</key><string>app.icns</string>
                    <key>CFBundlePackageType</key><string>APPL</string>
                  </dict>
                  </plist>
                  EOF
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-${{ github.event.release.tag_name }}-macos.zip"

            - name: 🪟 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = "${{ github.event.release.tag_name }}".Replace("v","")
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v$ver-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-${{ github.event.release.tag_name }}-linux.zip .

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: assets-${{ matrix.name }}
                  path: |
                      *.exe
                      *.zip

    publish:
        name: 🚀 Publish Assets
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download All Artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: assets-*
                  merge-multiple: true

            - name: Upload to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      *.exe
                      *.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 🧹 Cleanup Artifacts
              uses: geekyeggo/delete-artifact@v5
              with:
                  name: assets-*
