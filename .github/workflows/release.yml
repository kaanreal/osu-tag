name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version-bump:
        name: 🏷️ Version Bump
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        permissions:
            contents: write
        outputs:
            new_version: ${{ steps.bump.outputs.NEW_VERSION }}
            version_changed: ${{ steps.bump.outputs.VERSION_CHANGED }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Analyze Commit Tags
              id: analyze
              shell: bash
              run: |
                  # Get the range of commits
                  if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                    # New branch: check last commit
                    MESSAGES=$(git log --format="%s" -n 1)
                  else
                    # ONLY check new commits and IGNORE merge commits (--no-merges)
                    MESSAGES=$(git log --format="%s" --no-merges ${{ github.event.before }}..${{ github.event.after }})
                  fi

                  echo "--- New Work Found ---"
                  echo "$MESSAGES"

                  if echo "$MESSAGES" | grep -q "^major:"; then
                    echo "BUMP=major" >> $GITHUB_OUTPUT
                  elif echo "$MESSAGES" | grep -q "^feat:"; then
                    echo "BUMP=minor" >> $GITHUB_OUTPUT
                  elif echo "$MESSAGES" | grep -q "^fix:"; then
                    echo "BUMP=patch" >> $GITHUB_OUTPUT
                  else
                    echo "BUMP=none" >> $GITHUB_OUTPUT
                  fi

            - name: Update CSPROJ Version
              id: bump
              shell: pwsh
              run: |
                  $bumpType = "${{ steps.analyze.outputs.BUMP }}"
                  $path = "src/OsuTag/OsuTag.csproj"
                  $content = Get-Content $path -Raw

                  if ($content -match '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
                      $major, $minor, $patch = [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
                      $changed = "true"

                      if ($bumpType -eq "major") { $major++; $minor = 0; $patch = 0 }
                      elseif ($bumpType -eq "minor") { $minor++; $patch = 0 }
                      elseif ($bumpType -eq "patch") { $patch++ }
                      else { $changed = "false" }
                      
                      $newVer = "$major.$minor.$patch"
                      if ($changed -eq "true") {
                          $content -replace '<Version>[\d\.]+</Version>', "<Version>$newVer</Version>" | Set-Content $path
                          echo "NEW_VERSION=v$newVer" >> $env:GITHUB_OUTPUT
                      }
                      echo "VERSION_CHANGED=$changed" >> $env:GITHUB_OUTPUT
                  }

            - name: Push Version Update
              if: steps.bump.outputs.VERSION_CHANGED == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/OsuTag/OsuTag.csproj
                  git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }} [skip ci]"
                  git push origin main

    build:
        name: 🏗️ Build
        needs: version-bump
        if: needs.version-bump.outputs.version_changed == 'true'
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  # Create the structure macOS expects
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"

                  # Copy the binary
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"

                  # Copy the Icon (Must be .ico)
                  cp src/OsuTag/Assets/app.ico "osu!tag.app/Contents/Resources/app.ico"

                  # Create a basic Info.plist so macOS knows where the icon is
                  echo '<?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.microsoft.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>CFBundleIconFile</key>
                      <string>app.icns</string>
                      <key>CFBundleExecutable</key>
                      <string>OsuTag</string>
                      <key>CFBundlePackageType</key>
                      <string>APPL</string>
                  </dict>
                  </plist>' > "osu!tag.app/Contents/Info.plist"

                  # Use ditto to preserve permissions and metadata (fixes "Damaged" error)
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-${{ needs.version-bump.outputs.new_version }}-macos.zip"

            - name: 🪟 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = "${{ needs.version-bump.outputs.new_version }}".Replace("v","")
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v$ver-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-${{ needs.version-bump.outputs.new_version }}-linux.zip .

            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: assets-${{ matrix.name }}
                  path: |
                      *.exe
                      *.zip

    publish:
        name: 🚀 Publish
        needs: [version-bump, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: assets-*
                  merge-multiple: true

            - name: List Files (Debug)
              run: ls -R

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.version-bump.outputs.new_version }}
                  name: Release ${{ needs.version-bump.outputs.new_version }}
                  generate_release_notes: true
                  # THIS WAS MISSING: Tell the action which files to upload
                  files: |
                      *.exe
                      *.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    sync-testing:
        name: 🔄 Sync Testing Branch
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Merge main into testing
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Get the latest changes from main (including the version bump)
                  git fetch origin main
                  git checkout testing

                  # Merge main into testing to sync the version.txt/csproj
                  git merge origin/main

                  # Push back to testing
                  git push origin testing
