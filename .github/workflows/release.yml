name: Release

on:
    release:
        types: [published]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    versioning:
        name: Prepare Versioning
        runs-on: ubuntu-latest
        outputs:
            VERSION: ${{ steps.get_version.outputs.VERSION }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get Version
              id: get_version
              shell: bash
              run: |
                  VERSION=$(grep -oE '<Version>[^<]+' src/OsuTag/OsuTag.csproj | sed 's/<Version>//')
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    build:
        name: Build ${{ matrix.os }}
        needs: versioning
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"
                  cache: false

            - name: Publish (Self-Contained)
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: Create macOS App Bundle
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir app.iconset
                  sips -z 16 16   src/OsuTag/Assets/app.ico --out app.iconset/icon_16x16.png -s format png
                  sips -z 32 32   src/OsuTag/Assets/app.ico --out app.iconset/icon_16x16@2x.png -s format png
                  sips -z 32 32   src/OsuTag/Assets/app.ico --out app.iconset/icon_32x32.png -s format png
                  sips -z 64 64   src/OsuTag/Assets/app.ico --out app.iconset/icon_32x32@2x.png -s format png
                  sips -z 128 128 src/OsuTag/Assets/app.ico --out app.iconset/icon_128x128.png -s format png
                  sips -z 256 256 src/OsuTag/Assets/app.ico --out app.iconset/icon_128x128@2x.png -s format png
                  sips -z 256 256 src/OsuTag/Assets/app.ico --out app.iconset/icon_256x256.png -s format png
                  sips -z 512 512 src/OsuTag/Assets/app.ico --out app.iconset/icon_256x256@2x.png -s format png
                  sips -z 512 512 src/OsuTag/Assets/app.ico --out app.iconset/icon_512x512.png -s format png
                  sips -z 1024 1024 src/OsuTag/Assets/app.ico --out app.iconset/icon_512x512@2x.png -s format png
                  iconutil -c icns app.iconset

                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Info.plist "osu!tag.app/Contents/Info.plist"
                  cp app.icns "osu!tag.app/Contents/Resources/app.icns"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  zip -r osu-tag-v${{ needs.versioning.outputs.VERSION }}-macos.zip "osu!tag.app"

            - name: Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.versioning.outputs.VERSION }} installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v${{ needs.versioning.outputs.VERSION }}-win-portable.exe"

            - name: Zip Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-v${{ needs.versioning.outputs.VERSION }}-linux.zip .

            - name: Store Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: assets-${{ matrix.name }}
                  path: |
                      *.exe
                      *.zip
                  retention-days: 1

    publish:
        name: Finalize Release
        needs: [versioning, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: assets-*
                  merge-multiple: true

            - name: Upload Release Assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.release.tag_name }}
                  generate_release_notes: true
                  files: |
                      osu-tag-v*-win-setup.exe
                      osu-tag-v*-win-portable.exe
                      osu-tag-v*-macos.zip
                      osu-tag-v*-linux.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
