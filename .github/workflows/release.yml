name: Release

on:
  release:
    types: [published]

jobs:
  versioning:
    name: Prepare Versioning
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -oE '<Version>[^<]+' src/OsuTag/OsuTag.csproj | sed 's/<Version>//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Version Branch
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="release/v${{ steps.get_version.outputs.VERSION }}"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists."
          else
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: windows
          - os: macos-latest
            rid: osx-arm64
            name: macos
          - os: ubuntu-latest
            rid: linux-x64
            name: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (Self-Contained)
        run: |
          dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip Raw Package
        if: matrix.os != 'windows-latest'
        run: |
          cd publish
          zip -r ../osu-tag-v${{ needs.versioning.outputs.VERSION }}-${{ matrix.name }}.zip .

      # Windows: Create specific Installer and Zip
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item publish/OsuTag.exe -Destination "osu-tag-v${{ needs.versioning.outputs.VERSION }}-win-installer.exe"
          Compress-Archive -Path publish/* -DestinationPath "osu-tag-v${{ needs.versioning.outputs.VERSION }}-win.zip"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            osu-tag-*-win-installer.exe
            osu-tag-*-win.zip
            osu-tag-*-${{ matrix.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

