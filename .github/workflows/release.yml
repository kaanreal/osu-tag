name: Release

on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    version-bump:
        name: 🏷️ Version Bump
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        permissions:
            contents: write
        outputs:
            new_version: ${{ steps.bump.outputs.NEW_VERSION }}
            version_changed: ${{ steps.bump.outputs.VERSION_CHANGED }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Analyze Commits Since Last Tag
              id: analyze
              shell: bash
              run: |
                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -z "$LAST_TAG" ]; then
                    echo "No previous tag found – using full history"
                    MESSAGES=$(git log --format="%s" --no-merges)
                  else
                    echo "Last tag: $LAST_TAG"
                    MESSAGES=$(git log "$LAST_TAG"..HEAD --format="%s" --no-merges)
                  fi

                  echo "--- Commits considered for release ---"
                  echo "$MESSAGES"

                  if echo "$MESSAGES" | grep -q "^major:"; then
                    echo "BUMP=major" >> $GITHUB_OUTPUT
                  elif echo "$MESSAGES" | grep -q "^feat:"; then
                    echo "BUMP=minor" >> $GITHUB_OUTPUT
                  elif echo "$MESSAGES" | grep -q "^fix:"; then
                    echo "BUMP=patch" >> $GITHUB_OUTPUT
                  else
                    echo "BUMP=none" >> $GITHUB_OUTPUT
                  fi

            - name: Update CSPROJ Version
              id: bump
              shell: pwsh
              run: |
                  $bumpType = "${{ steps.analyze.outputs.BUMP }}"
                  $path = "src/OsuTag/OsuTag.csproj"
                  $content = Get-Content $path -Raw

                  if ($content -match '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
                    $major, $minor, $patch = [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
                    $changed = "true"

                    if ($bumpType -eq "major") { $major++; $minor = 0; $patch = 0 }
                    elseif ($bumpType -eq "minor") { $minor++; $patch = 0 }
                    elseif ($bumpType -eq "patch") { $patch++ }
                    else { $changed = "false" }

                    $newVer = "$major.$minor.$patch"

                    if ($changed -eq "true") {
                      $content -replace '<Version>[\d\.]+</Version>', "<Version>$newVer</Version>" | Set-Content $path
                      echo "NEW_VERSION=v$newVer" >> $env:GITHUB_OUTPUT
                    }

                    echo "VERSION_CHANGED=$changed" >> $env:GITHUB_OUTPUT
                  }

            - name: Push Version Update
              if: steps.bump.outputs.VERSION_CHANGED == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/OsuTag/OsuTag.csproj
                  git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }} [skip ci]"
                  git tag ${{ steps.bump.outputs.NEW_VERSION }}
                  git push origin main --tags

    build:
        name: 🏗️ Build
        needs: version-bump
        if: needs.version-bump.outputs.version_changed == 'true'
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns"

                  cat > "osu!tag.app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.microsoft.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                    <key>CFBundleExecutable</key><string>OsuTag</string>
                    <key>CFBundleIconFile</key><string>app.icns</string>
                    <key>CFBundlePackageType</key><string>APPL</string>
                  </dict>
                  </plist>
                  EOF

                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-${{ needs.version-bump.outputs.new_version }}-macos.zip"

            - name: 🪟 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = "${{ needs.version-bump.outputs.new_version }}".Replace("v","")
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v$ver-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-${{ needs.version-bump.outputs.new_version }}-linux.zip .

            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: assets-${{ matrix.name }}
                  path: |
                      *.exe
                      *.zip

    publish:
        name: 🚀 Publish
        needs: [version-bump, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: assets-*
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.version-bump.outputs.new_version }}
                  name: "Release ${{ needs.version-bump.outputs.new_version }}"
                  generate_release_notes: true
                  make_latest: true
                  files: |
                      *.exe
                      *.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 🧹 Cleanup Artifacts
              uses: geekyeggo/delete-artifact@v5
              with:
                  name: assets-*
