name: Release

on:
    push:
        branches:
            - main # Trigger only when merging testing -> main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version-bump:
        name: Version Bump
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]' # Prevent loops
        permissions:
            contents: write
        outputs:
            new_version: ${{ steps.bump.outputs.NEW_VERSION }}
            version_changed: ${{ steps.bump.outputs.VERSION_CHANGED }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Analyze commits
              id: analyze
              run: |
                  # Look for tags in the last 10 commits (handling squash merges)
                  COMMITS=$(git log --format="%s" -n 10)
                  if echo "$COMMITS" | grep -q "^major:"; then
                    echo "BUMP=major" >> $GITHUB_OUTPUT
                  elif echo "$COMMITS" | grep -q "^feat:"; then
                    echo "BUMP=minor" >> $GITHUB_OUTPUT
                  else
                    echo "BUMP=none" >> $GITHUB_OUTPUT
                  fi

            - name: Bump Version in CSPROJ
              id: bump
              shell: pwsh
              run: |
                  $bumpType = "${{ steps.analyze.outputs.BUMP }}"
                  $path = "src/OsuTag/OsuTag.csproj"
                  $content = Get-Content $path -Raw

                  if ($content -match '<Version>(\d+)\.(\d+)\.(\d+)</Version>') {
                      $major = [int]$Matches[1]
                      $minor = [int]$Matches[2]
                      $patch = [int]$Matches[3]
                      
                      if ($bumpType -eq "major") {
                          $major++; $minor = 0; $patch = 0
                          $changed = "true"
                      } elseif ($bumpType -eq "minor") {
                          $minor++; $patch = 0
                          $changed = "true"
                      } else {
                          $changed = "false"
                      }
                      
                      $newVer = "$major.$minor.$patch"
                      if ($changed -eq "true") {
                          $content -replace '<Version>[\d\.]+</Version>', "<Version>$newVer</Version>" | Set-Content $path
                          echo "NEW_VERSION=v$newVer" >> $env:GITHUB_OUTPUT
                      }
                      echo "VERSION_CHANGED=$changed" >> $env:GITHUB_OUTPUT
                  }

            - name: Commit & Push Version Change
              if: steps.bump.outputs.VERSION_CHANGED == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/OsuTag/OsuTag.csproj
                  git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }} [skip ci]"
                  git push origin main

    build:
        name: Build ${{ matrix.os }}
        needs: version-bump
        # Only build if the version was bumped
        if: needs.version-bump.outputs.version_changed == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: Create macOS App Bundle
              if: matrix.os == 'macos-latest'
              run: |
                  # (Your existing macOS bundling logic remains identical here)
                  # Use ${{ needs.version-bump.outputs.new_version }} for zip name
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  zip -r osu-tag-${{ needs.version-bump.outputs.new_version }}-macos.zip "osu!tag.app"

            - name: Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = "${{ needs.version-bump.outputs.new_version }}".Replace("v","")
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v$ver-win-portable.exe"

            - name: Zip Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-${{ needs.version-bump.outputs.new_version }}-linux.zip .

            - name: Store Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: assets-${{ matrix.name }}
                  path: |
                      *.exe
                      *.zip
                  retention-days: 1

    publish:
        name: Create GitHub Release
        needs: [version-bump, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: assets-*
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.version-bump.outputs.new_version }}
                  name: Release ${{ needs.version-bump.outputs.new_version }}
                  body: |
                      ## Changes in this version
                      Automated release triggered by commit tags.
                  generate_release_notes: true
                  files: |
                      osu-tag-v*-win-setup.exe
                      osu-tag-v*-win-portable.exe
                      osu-tag-v*-macos.zip
                      osu-tag-v*-linux.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
