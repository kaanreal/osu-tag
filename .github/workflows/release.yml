name: Release - Build & Upload

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_and_upload:
    name: Build and upload release artifacts
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Determine tag and version
        id: vars
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and $event.release -ne $null) {
            $tag = $event.release.tag_name
          } elseif ($env:GITHUB_REF -match 'refs/tags/(.+)$') {
            $tag = $Matches[1]
          } else {
            Write-Error "No tag found. This workflow must be triggered by a release or a tag push."
            exit 1
          }
          $version = $tag -replace '^[vV]', ''
          Write-Host "Tag: $tag  Version: $version"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Show .NET info
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore ./OsuTag.csproj

      - name: Publish (explicit, show errors)
        id: publish
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $v = $env:VERSION
          $publishOut = Join-Path $PWD 'build\dist\publish'
          if (Test-Path $publishOut) { Remove-Item $publishOut -Recurse -Force }
          Write-Host "Publishing to: $publishOut with version: $v"
          dotnet publish .\OsuTag.csproj -c Release -r win-x64 --self-contained false -o $publishOut -p:Version=$v -p:FileVersion=$v.0 -v:detailed
          if ($LASTEXITCODE -ne 0) {
            Write-Host "dotnet publish failed with exit code $LASTEXITCODE. See logs above for details."
            exit $LASTEXITCODE
          }

      - name: Install Inno Setup (choco)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $inno = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $inno) { Write-Error "ISCC.exe not found after install"; exit 1 }
          Write-Host "ISCC located at: $($inno.Path)"

      - name: Run installer build script
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $v = $env:VERSION
          $publishOut = Join-Path $PWD 'build\dist\publish'
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Host "No version supplied; script will auto-detect from source"
            powershell -ExecutionPolicy Bypass -File build/create-installer.ps1 -PublishPath $publishOut
          } else {
            Write-Host "Using published output at: $publishOut"
            powershell -ExecutionPolicy Bypass -File build/create-installer.ps1 -Version $v -PublishPath $publishOut
          }

      - name: Collect artifact paths
        id: artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $installer = Get-ChildItem -Path build\dist\installer -Filter 'OsuTag-Setup-*.exe' -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($installer) {
            # Convert to repository-relative path with forward slashes so actions that expect globs can match it
            $repo = (Get-Location).Path.TrimEnd('\')
            $rel = $installer.FullName
            if ($rel.StartsWith($repo)) { $rel = $rel.Substring($repo.Length + 1) }
            $rel = $rel -replace '\\','/'
            echo "installer_path=$rel" >> $env:GITHUB_OUTPUT
            Write-Host "Found installer: $($installer.FullName) (relative: $rel)"
          } else { echo "installer_path=" >> $env:GITHUB_OUTPUT; Write-Host "No installer found in build\dist\installer" }

          # Look for the publish ZIP in either build/ or build/dist/ (create-installer.ps1 currently emits build/dist)
          $zipCandidates = @( (Join-Path 'build' "OsuTag-$env:VERSION.zip"), (Join-Path 'build\dist' "OsuTag-$env:VERSION.zip") )
          $zipFound = $null
          foreach ($z in $zipCandidates) {
            if (Test-Path $z) { $zipFound = $z; break }
          }
          if ($zipFound) {
            $relzip = $zipFound
            if ($relzip.StartsWith($repo)) { $relzip = $relzip.Substring($repo.Length + 1) }
            $relzip = $relzip -replace '\\','/'
            echo "zip_path=$relzip" >> $env:GITHUB_OUTPUT
            Write-Host "Found ZIP: $zipFound (relative: $relzip)"
          } else { echo "zip_path=" >> $env:GITHUB_OUTPUT; Write-Host "No ZIP found at: $($zipCandidates -join ', ')" }


      - name: Fetch all tags and history
        run: |
          git fetch --prune --unshallow || true
          git fetch --tags



      - name: Generate Release Notes
        id: release_notes
        shell: pwsh
        run: |
          # Ensure all tags are fetched
          git fetch --tags

          # Get current tag
          $currTag = git describe --tags --abbrev=0

          # Get previous tag by date order (skip current)
          $allTags = git tag --sort=-creatordate
          $prevTag = $allTags | Where-Object { $_ -ne $currTag } | Select-Object -First 1

          # Get commit messages between previous and current tag
          if ($prevTag) {
            $commits = git log "$prevTag..$currTag" --pretty=format:"%s"
            if (-not $commits) {
              $commits = git log "$currTag" -n 1 --pretty=format:"%s"
            }
          } else {
            $commits = git log "$currTag" --pretty=format:"%s"
          }

          # Define categories and their prefixes for the template
          $categories = @(
            @{ Name = '✨ New Features'; Prefix = 'feat:' },
            @{ Name = '🛠 Improvements'; Prefix = 'imp:' },
            @{ Name = '🐞 Bug Fixes'; Prefix = 'fix:' },
            @{ Name = '🔧 Under the Hood'; Prefix = 'hood:' }
          )

          $catCommits = @{}
          foreach ($cat in $categories) { $catCommits[$cat.Name] = @() }

          foreach ($c in $commits) {
            $matched = $false
            foreach ($cat in $categories) {
              if ($c -like "$($cat.Prefix)*") {
                $msg = $c.Substring($cat.Prefix.Length).Trim()
                # Bold the first word before a colon or dash if present
                if ($msg -match '^(.*?)(:| -)') {
                  $first = $Matches[1].Trim()
                  $rest = $msg.Substring($first.Length)
                  $msg = "**$first**$rest"
                }
                $catCommits[$cat.Name] += $msg
                $matched = $true
                break
              }
            }
          }

          # Build release notes using the provided template
          $notes = "# osu!tag ${{ steps.vars.outputs.version }} – Release Notes`n`n"

          $anyCommits = $false
          foreach ($cat in $categories) {
            $items = $catCommits[$cat.Name]
            if ($items.Count -gt 0) {
              $notes += "## $($cat.Name)`n"
              foreach ($item in $items) {
                $notes += "- $item`n"
              }
              $notes += "`n"
              $anyCommits = $true
            }
          }

          if (-not $anyCommits) {
            $notes += "No categorized commits found for this release.`n"
          }

          $notes += "---`n`nThank you for using **osu!tag**!  `nDownload the new version and enjoy a smoother experience and easier installation.`n"

          # Save release notes
          $notesPath = "$PWD/release_notes.md"
          $notes | Out-File -FilePath $notesPath -Encoding utf8
          echo "release_notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          Write-Host "Generated release notes at: $notesPath"


      - name: Upload Artifacts and Set Release Notes
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.artifacts.outputs.zip_path }}
            ${{ steps.artifacts.outputs.installer_path }}
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.release_notes_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: |
          echo "Release workflow finished. Uploaded artifacts (if found)."
