name: 🔄 Auto-Sync Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-testing:
    name: Sync Main → Testing
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Main to Testing
        run: |
          # Fetch all branches
          git fetch origin
          
          # Check if testing branch exists
          if git ls-remote --exit-code --heads origin testing; then
            echo "Testing branch exists"
            git checkout testing
            git pull origin testing
          else
            echo "Creating testing branch"
            git checkout -b testing
          fi
          
          # Fast-forward or merge main into testing
          echo "Syncing main to testing..."
          if git merge origin/main --ff-only; then
            echo "Fast-forward merge successful"
          else
            echo "Fast-forward not possible, doing regular merge"
            git merge origin/main --no-edit -X theirs -m "chore: sync main to testing [skip ci]"
          fi
          
          # Push changes
          git push origin testing