name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: google-github-actions/release-please-action@v4
              with:
                  # Release-Please will automatically find your .csproj Version and update it, plus manage CHANGELOG.md
                  # By default, it will try to detect "component" from project root.
                  # You can specify the project path if needed:
                  # monorepo-tags: 'src/OsuTag/OsuTag.csproj'
                  token: ${{ secrets.GITHUB_TOKEN }}
