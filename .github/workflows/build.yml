name: Release & Build

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            body: ${{ steps.release.outputs.body }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.MY_RELEASE_TOKEN }}

    build:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                    - os: macos-latest
                      rid: osx-arm64
                    - os: ubuntu-latest
                      rid: linux-x64
        runs-on: ${{ matrix.os }}
        env:
            CLEAN_VER: ""
            RELEASE_BODY: ""
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Process Version and Body
              shell: bash
              run: |
                  VER=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed 's/[v.]//g')
                  echo "CLEAN_VER=$VER" >> $GITHUB_ENV

                  RAW_BODY=$(cat <<'EOF'
                  ${{ needs.release-please.outputs.body }}
                  EOF
                  )

                  CLEANED=$(echo "$RAW_BODY" | tail -n +3)
                  FINAL_BODY=$(echo "$CLEANED" | sed 's/### /---\n### /g')

                  echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
                  echo "$FINAL_BODY" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$CLEAN_VER -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns"
                  cat > "osu!tag.app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <plist version="1.0"><dict><key>CFBundleExecutable</key><string>OsuTag</string><key>CFBundleIconFile</key><string>app.icns</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
                  EOF
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-v.$CLEAN_VER-macos.zip"

            - name: 🟦 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = $env:CLEAN_VER
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v.$ver-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-v.$CLEAN_VER-linux.zip .

            - name: Upload Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  body: |
                      # osu!tag ${{ needs.release-please.outputs.tag_name }} – Release Notes
                      Author: @${{ github.actor }}

                      ${{ env.RELEASE_BODY }}
                  files: |
                      *.exe
                      *.zip
                      src/OsuTag/version.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
