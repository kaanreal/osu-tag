name: Semantic Release & Build

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release:
        name: 🚀 Release
        runs-on: ubuntu-latest
        outputs:
            new_release_published: ${{ steps.semantic.outputs.new_release_published }}
            new_release_version: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - uses: actions/checkout@v4
            - name: Semantic Release
              id: semantic
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      @semantic-release/commit-analyzer
                      @semantic-release/release-notes-generator
                      conventional-changelog-conventionalcommits
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build:
        name: 🏗️ Build Assets
        needs: release
        if: needs.release.outputs.new_release_published == 'true'
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Update Version in .csproj
              shell: pwsh
              run: |
                  $ver = "${{ needs.release.outputs.new_release_version }}"
                  (Get-Content src/OsuTag/OsuTag.csproj) -replace '<Version>.*</Version>', "<Version>$ver</Version>" | Set-Content src/OsuTag/OsuTag.csproj

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns"
                  cat > "osu!tag.app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <plist version="1.0">
                  <dict>
                    <key>CFBundleExecutable</key><string>OsuTag</string>
                    <key>CFBundleIconFile</key><string>app.icns</string>
                    <key>CFBundlePackageType</key><string>APPL</string>
                  </dict>
                  </plist>
                  EOF
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-v.${{ needs.release.outputs.new_release_version }}-macos.zip"

            - name: 🪟 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $ver = "${{ needs.release.outputs.new_release_version }}"
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v.$ver-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-v.${{ needs.release.outputs.new_release_version }}-linux.zip .

            - name: Upload to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v.${{ needs.release.outputs.new_release_version }}
                  files: |
                      *.exe
                      *.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
