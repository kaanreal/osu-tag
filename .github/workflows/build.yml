name: Release & Build

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    build:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      rid: win-x64
                    - os: macos-latest
                      rid: osx-arm64
                    - os: ubuntu-latest
                      rid: linux-x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Extract Version
              id: get_version
              shell: bash
              run: |
                  RAW_TAG="${{ needs.release-please.outputs.tag_name }}"
                  VERSION="${RAW_TAG#v}"
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Prepare Release Notes
              id: release_notes
              shell: bash
              run: |
                  # Extract the version from the tag (e.g., v1.1.1 -> 1.1.1)
                  TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
                  VERSION="${TAG_NAME#v}"
                  
                  # Create the header
                  HEADER="# osu!tag v$VERSION – Release Notes"
                  
                  # Get the changelog from release-please
                  # googleapis/release-please-action@v4 provides 'body' output
                  BODY=$(cat << 'EOF'
                  ${{ needs.release-please.outputs.body }}
                  EOF
                  )
                  
                  # Remove the default version header from release-please body if it exists
                  # (usually looks like ## [1.1.1](...))
                  CLEANED_BODY=$(echo "$BODY" | sed '1,2d')
                  
                  # Construct full body
                  FULL_BODY="$HEADER\n\n$CLEANED_BODY"
                  
                  # Use a heredoc for setting the environment variable to handle multi-line content safely
                  {
                    echo "RELEASE_BODY<<EOF"
                    echo -e "$FULL_BODY"
                    echo "EOF"
                  } >> $GITHUB_ENV

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} \
                  --self-contained -p:PublishSingleFile=true \
                  -p:IncludeNativeLibrariesForSelfExtract=true \
                  -p:Version=${{ steps.get_version.outputs.VERSION }} -o publish

            - name: Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns" || true
                  echo '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>OsuTag</string><key>CFBundleIconFile</key><string>app.icns</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "osu!tag.app/Contents/Info.plist"
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-v${{ steps.get_version.outputs.VERSION }}-macos.zip"

            - name: Package Windows
              if: matrix.os == 'windows-latest'
              run: |
                  if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                    & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.get_version.outputs.VERSION }} installer.iss
                  }
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v${{ steps.get_version.outputs.VERSION }}-win-portable.exe"

            - name: Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish && zip -r ../osu-tag-v${{ steps.get_version.outputs.VERSION }}-linux.zip .

            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  name: Release ${{ needs.release-please.outputs.tag_name }}
                  body: |
                      ${{ env.RELEASE_BODY }}

                      ---
                      Thank you for using **osu!tag**!
                      Download the new version and enjoy a smoother experience and easier installation.
                  files: |
                      *.exe
                      *.zip
