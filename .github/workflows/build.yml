name: Release & Build

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            body: ${{ steps.release.outputs.body }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.MY_RELEASE_TOKEN }}
                  include-component-in-tag: false

    build:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      rid: win-x64
                    - os: macos-latest
                      rid: osx-arm64
                    - os: ubuntu-latest
                      rid: linux-x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Prepare Release Notes
              id: release_notes
              shell: bash
              env:
                  RP_BODY: ${{ needs.release-please.outputs.body }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  HEADER="# osu!tag v$VERSION – Release Notes"
                  CLEANED_BODY=$(echo "$RP_BODY" | sed '1d' | sed 's/^### /## /g')
                  COMPARE_URL=$(echo "$RP_BODY" | grep -oE "https://github.com/[^/]+/[^/]+/compare/[v0-9.]+...[v0-9.]+" | head -n 1)

                  if [ -n "$COMPARE_URL" ]; then
                    FOOTER="\n\n**Full Changelog**: ($COMPARE_URL)"
                  else
                    FOOTER=""
                  fi

                  {
                    echo "RELEASE_BODY<<EOF"
                    echo -e "$HEADER\n\n$CLEANED_BODY$FOOTER"
                    echo "EOF"
                    echo "VERSION=$VERSION"
                  } >> $GITHUB_OUTPUT

            - name: Publish
              shell: bash
              run: |
                  dotnet publish src/osu!tag/Osutag.csproj -c Release -r ${{ matrix.rid }} \
                  --self-contained -p:PublishSingleFile=true \
                  -p:IncludeNativeLibrariesForSelfExtract=true \
                  -p:Version=${{ steps.release_notes.outputs.VERSION }} \
                  -o publish

                  if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
                    mv publish/Osutag.exe "publish/osu!tag.exe"
                  else
                    mv publish/Osutag "publish/osu!tag"
                  fi

            - name: Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp "publish/osu!tag" "osu!tag.app/Contents/MacOS/osu!tag"
                  chmod +x "osu!tag.app/Contents/MacOS/osu!tag"
                  cp src/osu!tag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns" || true
                  echo '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>osu!tag</string><key>CFBundleIconFile</key><string>app.icns</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "osu!tag.app/Contents/Info.plist"
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-v${{ steps.release_notes.outputs.VERSION }}-macos.zip"

            - name: Package Windows
              if: matrix.os == 'windows-latest'
              run: |
                  if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                    & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.release_notes.outputs.VERSION }} installer.iss
                  }
                  Copy-Item publish/osu!tag.exe -Destination "osu-tag-v${{ steps.release_notes.outputs.VERSION }}-win-portable.exe"

            - name: Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish && zip -r ../osu-tag-v${{ steps.release_notes.outputs.VERSION }}-linux.zip .

            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  name: Release v${{ steps.release_notes.outputs.VERSION }}
                  body: |
                      ${{ steps.release_notes.outputs.RELEASE_BODY }}

                      ---
                      Thank you for using **osu!tag** **<3**!
                  files: |
                      *.exe
                      *.zip
