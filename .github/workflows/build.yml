name: Release & Build (Release Please)

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            body: ${{ steps.release.outputs.body }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.MY_RELEASE_TOKEN }}

    build:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        strategy:
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      rid: win-x64
                      name: windows
                    - os: macos-latest
                      rid: osx-arm64
                      name: macos
                    - os: ubuntu-latest
                      rid: linux-x64
                      name: linux
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0"

            - name: Prepare Version Metadata
              shell: pwsh
              run: |
                  $ver = "${{ needs.release-please.outputs.tag_name }}".Replace("v.","").Replace("v","")
                  # Sicherstellen, dass die version.txt existiert/aktuell ist
                  New-Item -Path "src/OsuTag" -Name "version.txt" -ItemType "file" -Value $ver -Force
                  echo "CLEAN_VER=$ver" >> $env:GITHUB_ENV

            - name: Publish
              run: |
                  dotnet publish src/OsuTag/OsuTag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

            - name: 🍎 Package macOS
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "osu!tag.app/Contents/MacOS"
                  mkdir -p "osu!tag.app/Contents/Resources"
                  cp publish/OsuTag "osu!tag.app/Contents/MacOS/OsuTag"
                  chmod +x "osu!tag.app/Contents/MacOS/OsuTag"
                  cp src/OsuTag/Assets/app.icns "osu!tag.app/Contents/Resources/app.icns"
                  cat > "osu!tag.app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <plist version="1.0"><dict><key>CFBundleExecutable</key><string>OsuTag</string><key>CFBundleIconFile</key><string>app.icns</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
                  EOF
                  ditto -c -k --sequesterRsrc --keepParent "osu!tag.app" "osu-tag-v.${{ env.CLEAN_VER }}-macos.zip"

            - name: 🪟 Package Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.CLEAN_VER }} installer.iss
                  Copy-Item publish/OsuTag.exe -Destination "osu-tag-v.${{ env.CLEAN_VER }}-win-portable.exe"

            - name: 🐧 Package Linux
              if: matrix.os == 'ubuntu-latest'
              run: |
                  cd publish
                  zip -r ../osu-tag-v.${{ env.CLEAN_VER }}-linux.zip .

            - name: Upload to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  body: |
                      # osu!tag ${{ needs.release-please.outputs.tag_name }} – Release Notes
                      Author: @${{ github.actor }}

                      ${{ needs.release-please.outputs.body }}
                  files: |
                      *.exe
                      *.zip
                      src/OsuTag/version.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
