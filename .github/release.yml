changelog:
    exclude:
        authors:
            - github-actions[bot]
    categories:
        - title: "Features"
          labels:
              - feat
          commits:
              - "feat:*"
        - title: "Bug Fixes"
          labels:
              - fix
          commits:
              - "fix:*"
        - title: "Maintenance"
          commits:
              - "chore:*"
              - "docs:*"
              - "refactor:*"
