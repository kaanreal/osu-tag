changelog:
    exclude:
        authors:
            - github-actions[bot]
    categories:
        - title: "🚀 Features"
          filter:
              commit-expressions:
                  - "(?i)^feat" # Matcht feat:, Feat:, feat(ui):
        - title: "🐛 Bug Fixes"
          filter:
              commit-expressions:
                  - "(?i)^fix"
        - title: "🔧 Maintenance"
          filter:
              commit-expressions:
                  - "(?i)^(chore|docs|refactor|style)"
